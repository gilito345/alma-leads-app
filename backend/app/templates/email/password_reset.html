<!doctype html>
<html>
  <body style="margin:0;padding:24px;background:#f6f7f9;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:#1f2937;">
    <table role="presentation" width="100%" style="max-width:560px;margin:0 auto;background:#ffffff;border-radius:8px;padding:32px;">
      <tr><td>
        <h1 style="font-size:20px;margin:0 0 16px;">Reset your password</h1>
        <p style="font-size:15px;line-height:1.6;margin:0 0 20px;">
          Someone asked to reset the password for your leads dashboard account. If it was you,
          choose a new one here:
        </p>
        <p style="margin:0 0 20px;">
          <a href="{{ link }}" style="display:inline-block;background:#1f2937;color:#ffffff;text-decoration:none;font-size:15px;padding:10px 18px;border-radius:6px;">Choose a new password</a>
        </p>
        <p style="font-size:13px;line-height:1.6;margin:0;color:#6b7280;">
          The link works once and expires in {{ expiry_hours }} hours. If you didn't ask for
          this, ignore this email: your password stays the same.
        </p>
      </td></tr>
    </table>
  </body>
</html>
