<!doctype html>
<html>
  <body style="margin:0;padding:24px;background:#f6f7f9;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:#1f2937;">
    <table role="presentation" width="100%" style="max-width:560px;margin:0 auto;background:#ffffff;border-radius:8px;padding:32px;">
      <tr><td>
        <h1 style="font-size:20px;margin:0 0 16px;">New lead: {{ lead.full_name }}</h1>
        <table role="presentation" style="font-size:15px;line-height:1.6;margin:0 0 24px;">
          <tr><td style="color:#6b7280;padding-right:16px;">Name</td><td>{{ lead.full_name }}</td></tr>
          <tr><td style="color:#6b7280;padding-right:16px;">Email</td><td>{{ lead.email }}</td></tr>
          <tr><td style="color:#6b7280;padding-right:16px;">Resume</td><td>{{ lead.resume_filename }}</td></tr>
        </table>
        <a href="{{ lead_url }}" style="display:inline-block;background:#111827;color:#ffffff;text-decoration:none;padding:10px 18px;border-radius:6px;font-size:14px;">
          Open in dashboard
        </a>
        <p style="font-size:13px;color:#6b7280;margin:24px 0 0;">
          Replying to this email goes straight to the prospect.
        </p>
      </td></tr>
    </table>
  </body>
</html>
