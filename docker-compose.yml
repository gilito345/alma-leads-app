name: leads

# Supabase (Postgres, Auth, Storage) runs separately via `supabase start` from the repo root.
# These containers reach it on the host through host.docker.internal.

x-reach-host: &reach-host
  extra_hosts:
    # Built in on Docker Desktop (Windows/macOS); this line makes it work on Linux too.
    - "host.docker.internal:host-gateway"

services:
  api:
    build: ./backend
    env_file: .env
    <<: *reach-host
    environment:
      # Trust X-Forwarded-For from the web container so rate limits apply per visitor.
      FORWARDED_ALLOW_IPS: "*"
    # Keeps retrying (e.g. migrations) until `supabase start` has the database up.
    restart: on-failure
    ports:
      - "8000:8000" # OpenAPI docs at http://localhost:8000/docs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  worker:
    build: ./backend
    env_file: .env
    <<: *reach-host
    command: ["python", "-m", "app.worker"]
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy # the API runs the migrations

  web:
    build: ./frontend
    env_file: .env
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
