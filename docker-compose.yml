name: leads

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    env_file: .env
    environment:
      # Trust X-Forwarded-For from the web container so rate limits apply per visitor.
      FORWARDED_ALLOW_IPS: "*"
      # Resumes are kept on a Docker volume locally; set STORAGE_BACKEND=s3 for S3.
      LOCAL_STORAGE_DIR: /data/resumes
    volumes:
      - resumes:/data/resumes
    ports:
      - "8000:8000" # OpenAPI docs at http://localhost:8000/docs
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  worker:
    build: ./backend
    env_file: .env
    command: ["python", "-m", "app.worker"]
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy # the API runs the migrations

  web:
    build: ./frontend
    env_file: .env
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  db-data:
  resumes:
